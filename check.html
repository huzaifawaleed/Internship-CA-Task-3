<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About Me</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f4f7fa;
    }
    .container {
      position: relative;
      width: 90%;
      max-width: 1200px;
      height: 70vh;
      background: #fff;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border-radius: 10px;
    }
    .background {
      position: absolute;
      top: 0;
      right: 0;
      width: 60%;
      height: 100%;
      background: #00b894;
      clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 100%);
      z-index: 0;
    }
    .content {
      position: relative;
      z-index: 1;
      padding: 40px;
      display: flex;
      align-items: center;
      height: 100%;
    }
    .text-section {
      flex: 1;
    }
    .text-section h1 {
      color: #2c3e50;
      font-size: 2.5em;
      margin: 0;
    }
    .text-section h2 {
      color: #7f8c8d;
      font-size: 1.2em;
      margin: 10px 0;
    }
    .text-section p {
      color: #7f8c8d;
      font-size: 1em;
      line-height: 1.5;
    }
    .text-section a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #00b894;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
    }
    .image-section {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .image-section img {
      max-width: 100%;
      height: auto;
      border-radius: 50%;
    }
    nav {
      position: absolute;
      top: 20px;
      left: 20px;
    }
    nav ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
    }
    nav ul li {
      margin-right: 15px;
    }
    nav ul li a {
      color: #2c3e50;
      text-decoration: none;
      font-size: 1.1em;
    }
    .logo {
      position: absolute;
      top: 20px;
      left: 20px;
      color: #2c3e50;
      font-size: 1.5em;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="background"></div>
    <div class="content">
      <div class="text-section">
        <nav>
          <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Pricing</a></li>
            <li><a href="#">Experience</a></li>
          </ul>
        </nav>
        <div class="logo">Freelancer</div>
        <h1>Hello I'm <br> John Smith</h1>
        <h2>Professional Freelance Web Designer</h2>
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit sed diam nonummy.</p>
        <a href="#">Hire Me</a>
      </div>
      <div class="image-section">
        <img src="https://via.placeholder.com/300" alt="John Smith">
      </div>
    </div>
  </div>
</body>
</html>
