 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    body{
        background-color: black;
    }
 .timeline {
  position: relative;
  padding: 40px 0;
  max-width: 1000px;
  margin: auto;
}

.timeline::before {
  content: '';
  position: absolute;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 100%;
  background-color: #ffbd39;
  z-index: 0;
}

.timeline-item {
  position: relative;
  width: 100%;
  display: flex;
  justify-content: flex-start;
  margin-bottom: 60px;
}

.timeline-item.right {
  justify-content: flex-end;
}

.timeline-circle {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  top: 0;
  width: 20px;
  height: 20px;
  background-color:#0f0f0f;
  border: 4px solid #ffbd39;
  border-radius: 50%;
  z-index: 2;
}

.timeline-content {
  background: #0f0f0f;
  color: white;
  border: 1px solid #ffbd39;
  padding: 10px 15px;
  border-radius: 8px;
  width: 45%;
  position: relative;
  z-index: 1;
}

.timeline-item.left .timeline-content {
  text-align: right;
}

.timeline-item.right .timeline-content {
  text-align: left;
}

/* Responsive: stack vertically on small screens */
@media (max-width: 768px) {
  .timeline::before {
    left: 8px;
    transform: none;
  }

  .timeline-circle {
    left: 0px;
    transform: none;
  }

  .timeline-item,
  .timeline-item.right,
  .timeline-item.left {
    justify-content: flex-start;
  }

  .timeline-content {
    width: calc(100% - 40px);
    margin-left: 40px;
    text-align: left;
  }
  .timeline-item.left .timeline-content {
  text-align: left;
}
}


</style>

<body>
   <section id="education" class="py-5">
  <div class="container">
     <h1 class="white font center mt-4">Education</h1>


    <div class="timeline">
      <!-- Timeline Item Left -->
      <div class="timeline-item left">
        <div class="timeline-circle"></div>
        <div class="timeline-content">
          <h4>Bachelor's in Computer Science</h4>
          <p>Iqra University | 2025 - Present</p>
        </div>
      </div>

      <!-- Timeline Item Right -->
      <div class="timeline-item right">
        <div class="timeline-circle"></div>
        <div class="timeline-content">
          <h4>DAE in Software Engineering</h4>
          <p>Aptech Computer Education | 2023 - 2025</p>
        </div>
      </div>
<!-- Timeline Item Left -->
      <div class="timeline-item left">
        <div class="timeline-circle"></div>
        <div class="timeline-content">
          <h4>Intermediate in Computer Science</h4>
          <p>Punjab Group of Colleges | 2021 - 2023</p>
        </div>
      </div>
<!-- Timeline Item Right -->
      <div class="timeline-item right">
        <div class="timeline-circle"></div>
        <div class="timeline-content">
          <h4>Matric in Computer Science</h4>
          <p>Brain Higher School | 2011 - 2021</p>
        </div>
      </div>
    </div>
  </div>
</section>



</body>
</html>
