 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .timeline {
  position: relative;
  margin: 0 auto;
  padding: 20px 0;
  max-width: 900px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 50%;
  width: 4px;
  height: 100%;
  background: #00b894;
  transform: translateX(-50%);
}

.timeline-item {
  position: relative;
  width: 50%;
  padding: 20px 40px;
  box-sizing: border-box;
}

.timeline-item.left {
  left: 0;
  text-align: right;
}

.timeline-item.right {
  left: 50%;
  text-align: left;
}

.timeline-item .content {
  background: #fff;
  padding: 15px 20px;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

@media (max-width: 768px) {
  .timeline::before {
    left: 8px;
  }

  .timeline-item {
    width: 100%;
    left: 0 !important;
    padding-left: 30px;
    text-align: left;
  }
}

</style>

<body>
    <section class="education-section py-5">
  <h2 class="text-center mb-5">Education</h2>
  <div class="timeline">
    <div class="timeline-item left">
      <div class="content">
        <h4>Bachelor's in Applied Computing</h4>
        <p>XYZ University | 2020 - 2024</p>
      </div>
    </div>
    <div class="timeline-item right">
      <div class="content">
        <h4>Intermediate in Pre-Engineering</h4>
        <p>ABC College | 2018 - 2020</p>
      </div>
    </div> 
    
  </div>
</section>

</body>
</html>
